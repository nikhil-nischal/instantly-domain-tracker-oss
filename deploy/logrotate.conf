# Rotates the daily-sync logs so they don't grow unbounded.
# Install: sudo cp deploy/logrotate.conf /etc/logrotate.d/domain-tracker
# (edit the path below if you didn't deploy to /opt/instantly-domain-tracker)

/opt/instantly-domain-tracker/data/cron.log /opt/instantly-domain-tracker/data/cron.err {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
