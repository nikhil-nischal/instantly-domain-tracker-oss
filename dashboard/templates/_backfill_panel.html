<!-- ════════════════════════════════════════════════════════════
     BACKFILL PANEL — Shrishti Design
     Shared partial: included full-width in the no-data state, and in
     the right column of the overview top row when data exists.
     ════════════════════════════════════════════════════════════ -->
<div class="backfill-panel" id="backfill-panel">
    <div class="backfill-panel-header">
        <div class="backfill-panel-title">
            <div class="backfill-panel-title-icon" id="bf-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
            </div>
            <div class="backfill-panel-title-text">
                <h3 id="bf-title">Data Backfill</h3>
                <span class="sub" id="bf-subtitle">Checking sync status…</span>
            </div>
        </div>
        <div class="backfill-panel-badge" id="bf-badge">
            <span style="display:inline-flex;align-items:center;gap:6px;">
                <span style="width:10px;height:10px;border:2px solid rgba(99,102,241,0.3);border-top-color:var(--accent);border-radius:50%;animation:btn-spin 0.6s linear infinite;display:inline-block;"></span>
                Checking…
            </span>
        </div>
    </div>
    <div class="backfill-panel-body" id="bf-body">
        <!-- Skeleton state shown initially -->
        <div id="bf-skeleton">
            <div class="pending-days-info">
                <div class="pending-days-calendar">
                    <div class="bf-skeleton" style="height: 12px; width: 80px; border-radius: 4px; margin-bottom: 6px;"></div>
                    <div>
                        <span class="bf-skeleton bf-skeleton-chip"></span>
                        <span class="bf-skeleton bf-skeleton-chip"></span>
                        <span class="bf-skeleton bf-skeleton-chip" style="width: 80px;"></span>
                    </div>
                </div>
                <div class="backfill-actions">
                    <span class="bf-skeleton bf-skeleton-btn"></span>
                    <span class="bf-skeleton bf-skeleton-btn" style="width: 130px;"></span>
                </div>
            </div>
        </div>
        <!-- Idle: pending days (rendered by JS) -->
        <div id="bf-pending" style="display:none;">
            <div class="pending-days-info">
                <div class="pending-days-calendar">
                    <div class="pending-days-label" id="bf-pending-label">Missing days</div>
                    <div class="pending-days-chips" id="bf-chips"></div>
                </div>
                <div class="backfill-actions" id="bf-actions"></div>
            </div>
            <div class="backfill-progress-block" id="bf-progress">
                <div class="progress-track">
                    <div class="progress-track-fill" id="bf-progress-fill" style="width: 0%;"></div>
                </div>
                <div class="progress-status-row">
                    <span class="progress-step-label" id="bf-step-label">Ready</span>
                    <span class="progress-pct-label" id="bf-pct-label">0%</span>
                </div>
            </div>
        </div>
        <!-- Caught-up state -->
        <div id="bf-caught-up" style="display:none;">
            <div class="pending-days-info">
                <div class="pending-days-empty" id="bf-caught-msg">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="16 12 12 8 8 12"/>
                        <line x1="12" y1="16" x2="12" y2="9"/>
                    </svg>
                    All data synced through today
                </div>
            </div>
        </div>
        <!-- Success message (shown temporarily after completion) -->
        <div class="backfill-success-msg" id="bf-success">
            <span class="success-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
            </span>
            <span id="bf-success-text">Sync completed.</span>
        </div>
        <!-- Error message -->
        <div class="backfill-error-msg" id="bf-error">
            <span class="error-icon">!</span>
            <span class="error-text" id="bf-error-text">An error occurred.</span>
            <button class="error-retry-btn" onclick="loadBackfillPanel()">Try Again</button>
        </div>
        <!-- First-time empty state -->
        <div id="bf-first-time" style="display:none;">
            <div class="pending-days-info">
                <div class="pending-days-calendar">
                    <div style="font-size: 13px; color: var(--text-secondary);">
                        No data has been imported yet. Start a backfill to fetch your email metrics.
                    </div>
                </div>
                <div class="backfill-actions">
                    <button class="bf-btn bf-btn-primary" onclick="if(!this.disabled)handleBackfillAll()">
                        <span class="bf-btn-icon">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="23 4 23 10 17 10"/>
                                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                            </svg>
                        </span>
                        Start First Backfill
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
